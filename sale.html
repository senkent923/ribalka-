<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Акции и скидки в магазине РЫБОЛОВ — спиннинги, катушки, воблеры и снасти по сниженным ценам.">
  <title>Акции и скидки — РЫБОЛОВ · Санкт-Петербург</title>

  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

<body data-page="sale">

  <section class="page-hero">
    <div class="container">
      <nav class="crumbs"><a href="index.html">Главная</a> <span>/</span> Акции</nav>

        <div class="promo__badge">−15%</div>

      <div class="products" id="saleGrid"></div>

  <script src="js/products.js"></script>
